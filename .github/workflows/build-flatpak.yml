name: 'sync-flatpak'

on:
  workflow_dispatch:
  repository_dispatch:
    types: [flatpak-release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_KEY: ${{ vars.FLATPAK_GPG_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak ostree gnupg jq gh

      - name: Set GPG paths
        run: |
          echo "GPG_KEY_FILE=${RUNNER_TEMP}/applejuice-secret.asc" >> "$GITHUB_ENV"
          echo "GNUPGHOME=${RUNNER_TEMP}/flatpak-gnupg" >> "$GITHUB_ENV"
        shell: bash

      - name: Create GPG key file
        run: |
          install -d -m 700 "$GNUPGHOME"
          umask 077
          printf '%s\n' "$FLATPAK_GPG_KEY" > "$GPG_KEY_FILE"
        env:
          FLATPAK_GPG_KEY: ${{ secrets.FLATPAK_GPG_KEY }}
        shell: bash

      - name: Import release bundles and sign repository
        run: |
          make sync-all GPG_KEY_FILE="$GPG_KEY_FILE" GPG_KEY="$GPG_KEY"
        shell: bash

      - name: Remove signing key
        if: always()
        run: |
          rm -f "$GPG_KEY_FILE"
          rm -rf "$GNUPGHOME"

      - name: Prepare Pages content
        run: |
          sudo rm -rf ./pages
          sudo mkdir -p ./pages
          sudo chown -R "$(id -u):$(id -g)" ./pages
          cp ./README.md ./pages/README.md
          mkdir -p ./pages/repo
          sudo cp -R ./repo/. ./pages/repo/
          for f in applejuice.flatpakrepo applejuice.gpg applejuice.png; do
            if [ -f "./repo/$f" ]; then
              sudo cp "./repo/$f" "./pages/repo/$f"
            fi
          done
          sudo rm -f ./pages/repo/.lock
          sudo chown -R "$(id -u):$(id -g)" ./pages
        shell: bash

      - name: Render README as index page
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const md = fs.readFileSync('README.md', 'utf8');
            const html = await github.rest.markdown.render({
              text: md,
              mode: 'gfm',
              context: process.env.GITHUB_REPOSITORY
            });

            const page = `<!doctype html>
            <html lang="de">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>appleJuice Flatpak Repository</title>
              <link rel="icon" type="image/png" href="repo/applejuice.png">
              <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.9.0/github-markdown.min.css">
              <style>
                body { box-sizing: border-box; margin: 0; }
                .markdown-body { max-width: 980px; margin: 0 auto; padding: 24px; }
              </style>
            </head>
            <body>
              <article class="markdown-body">${html.data}</article>
            </body>
            </html>`;

            fs.writeFileSync('pages/index.html', page, 'utf8');

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pages

  deploy:
    runs-on: ubuntu-latest
    needs: sync
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
