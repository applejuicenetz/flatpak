id: io.github.applejuicenetz.core
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ajcore
tags:
    - internet
    - network
    - java
    - openjdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
build-options:
  no-debuginfo: true
finish-args:
  - --share=network
  - --socket=x11
  - --filesystem=~/appleJuice:create
  - --filesystem=/media
  - --filesystem=/run/media
  - --filesystem=/mnt
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: binary
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/io.github.applejuicenetz.core/ ajcore.jar
    sources:
      - type: file
        url: https://github.com/applejuicenetz/core/releases/download/0.34.101.42/ajcore-0.34.101.42-SNAPSHOT.jar
        sha256: 8e355754b4f4c64238b84aa5e9852725f5beda269f2c099316b7c5088b6b2984
        dest-filename: ajcore.jar

  - name: starter
    buildsystem: simple
    build-commands:
      - install -Dm755 io.github.applejuicenetz.core.sh /app/bin/ajcore
    sources:
      - type: file
        path: ./core/io.github.applejuicenetz.core.sh

  - name: app-icon
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.core.png /app/share/icons/hicolor/512x512/apps/io.github.applejuicenetz.core.png
    sources:
      - type: file
        path: ./core/io.github.applejuicenetz.core.png

  - name: splash-image
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.core.splash.png /app/share/io.github.applejuicenetz.core/splash.png
    sources:
      - type: file
        path: ./core/io.github.applejuicenetz.core.splash.png

  - name: desktop-file
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.core.desktop /app/share/applications/io.github.applejuicenetz.core.desktop
    sources:
      - type: file
        path: ./core/io.github.applejuicenetz.core.desktop

  - name: metainfo
    buildsystem: simple
    build-commands:
      - install -Dm644 io.github.applejuicenetz.core.metainfo.beta.xml /app/share/metainfo/io.github.applejuicenetz.core.metainfo.xml
    sources:
      - type: file
        path: ./core/io.github.applejuicenetz.core.metainfo.beta.xml
